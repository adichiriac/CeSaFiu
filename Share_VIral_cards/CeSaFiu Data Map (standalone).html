  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"ro\"><head>\n<meta charset=\"utf-8\">\n<title>CeSaFiu — Data Map<\u002Ftitle>\n\n<style>\n  :root {\n    --paper: #FAF6EC;\n    --paper-2: #F1ECDC;\n    --ink: #111;\n    --ink-soft: #555;\n    --purple: #7C3AED;\n    --yellow: #FFE066;\n    --green: #B8E986;\n    --red: #FF6B6B;\n    --blue: #4DD0E1;\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    font-family: -apple-system, \"Inter\", system-ui, sans-serif;\n    background: var(--paper);\n    color: var(--ink);\n    overflow: hidden;\n  }\n  .header {\n    position: fixed; top: 0; left: 0; right: 0; z-index: 10;\n    padding: 14px 20px; background: var(--ink); color: #fff;\n    border-bottom: 2px solid #000;\n    display: flex; align-items: center; justify-content: space-between; gap: 16px;\n    flex-wrap: wrap;\n  }\n  .header h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 0.3px; }\n  .header .stats { font-size: 12px; opacity: 0.8; }\n  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }\n  .controls .seg {\n    display: flex; gap: 0; border: 2px solid #fff;\n  }\n  .controls .seg button {\n    padding: 6px 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;\n    background: transparent; color: #fff; border: none; cursor: pointer;\n    text-transform: uppercase;\n  }\n  .controls .seg button[aria-pressed=\"true\"] { background: var(--yellow); color: #000; }\n  .controls input[type=\"search\"] {\n    padding: 6px 10px; font-size: 12px;\n    background: #222; color: #fff; border: 2px solid #444;\n    width: 180px;\n  }\n  .controls input[type=\"search\"]:focus { border-color: var(--yellow); outline: none; }\n  .legend {\n    position: fixed; bottom: 16px; left: 16px; z-index: 10;\n    background: #fff; border: 2px solid #000;\n    padding: 12px 14px; box-shadow: 4px 4px 0 #000;\n    font-size: 11px; line-height: 1.6;\n    max-width: 240px;\n  }\n  .legend .row { display: flex; align-items: center; gap: 8px; }\n  .legend .swatch { width: 14px; height: 14px; border: 1.5px solid #000; flex-shrink: 0; }\n  .legend strong { display: block; margin-bottom: 6px; font-size: 12px; }\n  .hint {\n    position: fixed; bottom: 16px; right: 16px; z-index: 10;\n    background: var(--yellow); border: 2px solid #000;\n    padding: 8px 12px; font-size: 11px; box-shadow: 4px 4px 0 #000;\n    font-weight: 600;\n  }\n  #stage { position: absolute; top: 56px; bottom: 0; left: 0; right: 0; cursor: grab; }\n  #stage.dragging { cursor: grabbing; }\n  #stage svg { display: block; }\n\n  /* Node styles inside SVG (via classes) */\n  .node text { pointer-events: none; font-family: inherit; }\n  .node rect { stroke: #000; stroke-width: 1.5; cursor: pointer; transition: filter 0.12s; }\n  .node:hover rect { filter: drop-shadow(2px 2px 0 #000); }\n  .node.dimmed rect { opacity: 0.18; }\n  .node.dimmed text { opacity: 0.25; }\n  .node.highlight rect { stroke-width: 3; }\n\n  .edge { fill: none; stroke: #000; stroke-opacity: 0.18; stroke-width: 1; pointer-events: none; }\n  .edge.dimmed { stroke-opacity: 0.04; }\n  .edge.highlight { stroke-opacity: 0.85; stroke-width: 2; }\n\n  .col-label {\n    font-weight: 900; font-size: 11px; letter-spacing: 1.5px;\n    fill: var(--ink-soft); text-transform: uppercase;\n  }\n  .col-count { fill: var(--ink-soft); font-size: 10px; font-weight: 600; }\n\n  /* Side detail panel */\n  .panel {\n    position: fixed; top: 56px; right: 0; bottom: 0; width: 360px; z-index: 9;\n    background: #fff; border-left: 2px solid #000;\n    padding: 20px 22px; overflow-y: auto;\n    transform: translateX(100%); transition: transform 0.2s;\n    box-shadow: -6px 0 0 rgba(0,0,0,0.05);\n  }\n  .panel.open { transform: translateX(0); }\n  .panel .close {\n    position: absolute; top: 12px; right: 12px;\n    background: #000; color: #fff; border: 2px solid #000;\n    width: 32px; height: 32px; cursor: pointer; font-size: 16px; font-weight: 900;\n  }\n  .panel .kind {\n    display: inline-block; padding: 3px 8px; font-size: 10px; font-weight: 800;\n    letter-spacing: 1px; border: 2px solid #000; margin-bottom: 10px; text-transform: uppercase;\n  }\n  .panel h2 { margin: 4px 0 6px; font-size: 22px; line-height: 1.15; font-weight: 900; }\n  .panel .tagline { color: var(--ink-soft); margin-bottom: 16px; font-size: 13px; }\n  .panel h3 { margin: 16px 0 6px; font-size: 11px; letter-spacing: 1.5px; color: var(--ink-soft); text-transform: uppercase; font-weight: 800; }\n  .panel ul { margin: 0; padding: 0; list-style: none; }\n  .panel ul li { padding: 6px 0; border-bottom: 1px solid #eee; font-size: 13px; cursor: pointer; }\n  .panel ul li:hover { background: var(--paper-2); }\n  .panel ul li .small { display: block; font-size: 11px; color: var(--ink-soft); margin-top: 2px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"header\">\n  <div>\n    <h1>CeSaFiu — Data Map<\u002Fh1>\n    <div class=\"stats\" id=\"stats\">Se încarcă…<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"controls\">\n    <input type=\"search\" id=\"search\" placeholder=\"Caută cariere, programe, unis…\">\n    <div class=\"seg\" role=\"tablist\" aria-label=\"Layout\">\n      <button data-layout=\"columns\" aria-pressed=\"true\">Coloane<\u002Fbutton>\n      <button data-layout=\"radial\" aria-pressed=\"false\">Radial<\u002Fbutton>\n    <\u002Fdiv>\n    <button id=\"reset\" style=\"padding: 6px 10px; font-size: 11px; font-weight: 700; background: var(--yellow); color: #000; border: 2px solid #fff; cursor: pointer; letter-spacing: 0.5px;\">RESET ZOOM<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"stage\"><\u002Fdiv>\n\n<div class=\"legend\">\n  <strong>Cele 4 straturi<\u002Fstrong>\n  <div class=\"row\"><div class=\"swatch\" style=\"background: var(--purple)\"><\u002Fdiv>Trasee (drumuri de viață) — 6<\u002Fdiv>\n  <div class=\"row\"><div class=\"swatch\" style=\"background: var(--yellow)\"><\u002Fdiv>Cariere (joburi reale) — <span id=\"lc\"><\u002Fspan><\u002Fdiv>\n  <div class=\"row\"><div class=\"swatch\" style=\"background: var(--green)\"><\u002Fdiv>Programe universitare — <span id=\"lp\"><\u002Fspan><\u002Fdiv>\n  <div class=\"row\"><div class=\"swatch\" style=\"background: var(--blue)\"><\u002Fdiv>Universități — <span id=\"lu\"><\u002Fspan><\u002Fdiv>\n  <div style=\"margin-top: 8px; font-size: 10px; color: var(--ink-soft); line-height: 1.4;\">\n    Linii: <b>traseu→cariera<\u002Fb> (pathType), <b>program→cariera<\u002Fb> (careerIds[]), <b>program→uni<\u002Fb> (universityId).\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"hint\">\n  ⚲ scroll = zoom · ✥ drag = pan · click = focus\n<\u002Fdiv>\n\n<aside class=\"panel\" id=\"panel\">\n  <button class=\"close\" aria-label=\"Închide\" onclick=\"closePanel()\">×<\u002Fbutton>\n  <div id=\"panel-body\"><\u002Fdiv>\n<\u002Faside>\n\n<script src=\"595da559-425d-457d-b249-a5e28c9d858d\"><\u002Fscript>\n<script>\n(function () {\n  const D = window.QUIZ_DATA;\n  const PATHS = D.paths || [];\n  const CAREERS = D.careers || [];\n  const PROGRAMS = D.programs || [];\n  const UNIS = D.universities || [];\n\n  // ── Stats ──────────────────────────────────────────────\n  document.getElementById('stats').textContent =\n    `${PATHS.length} trasee · ${CAREERS.length} cariere · ${PROGRAMS.length} programe · ${UNIS.length} universități`;\n  document.getElementById('lc').textContent = CAREERS.length;\n  document.getElementById('lp').textContent = PROGRAMS.length;\n  document.getElementById('lu').textContent = UNIS.length;\n\n  // ── Color tokens ───────────────────────────────────────\n  const COLOR = {\n    path: 'var(--purple)',\n    career: 'var(--yellow)',\n    program: 'var(--green)',\n    uni: 'var(--blue)',\n  };\n\n  // CSS var → real color (for SVG fill, can't always use var())\n  function cssVar(v) {\n    return getComputedStyle(document.documentElement).getPropertyValue(v).trim();\n  }\n  const FILL = {\n    path: cssVar('--purple'),\n    career: cssVar('--yellow'),\n    program: cssVar('--green'),\n    uni: cssVar('--blue'),\n  };\n  const TEXT = { path: '#fff', career: '#000', program: '#000', uni: '#000' };\n\n  // ── Build nodes & edges ────────────────────────────────\n  // Sort careers by pathType so the column groups visually\n  const PATH_ORDER = ['facultate', 'autodidact', 'antreprenor', 'freelance', 'creator', 'profesional'];\n  const careersSorted = [...CAREERS].sort((a, b) => {\n    const ai = PATH_ORDER.indexOf(a.pathType);\n    const bi = PATH_ORDER.indexOf(b.pathType);\n    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);\n  });\n\n  // Programs sorted by uni so nearby programs cluster\n  const programsSorted = [...PROGRAMS].sort((a, b) => a.universityId.localeCompare(b.universityId));\n\n  // Universities sorted by tier then name\n  const tierOrder = { 'TOP': 0, 'GOOD': 1 };\n  const unisSorted = [...UNIS].sort((a, b) => {\n    const ta = tierOrder[a.tier] ?? 9;\n    const tb = tierOrder[b.tier] ?? 9;\n    if (ta !== tb) return ta - tb;\n    return a.name.localeCompare(b.name);\n  });\n\n  // Build nodes with kind+id\n  const nodes = [];\n  PATHS.forEach((p) => nodes.push({ kind: 'path', id: p.id, label: p.name, raw: p }));\n  careersSorted.forEach((c) => nodes.push({ kind: 'career', id: c.id, label: c.name, raw: c }));\n  programsSorted.forEach((p) => nodes.push({ kind: 'program', id: p.id, label: p.name, raw: p }));\n  unisSorted.forEach((u) => nodes.push({ kind: 'uni', id: u.id, label: u.name.replace(/^(Universitatea|Academia|UMF|UNARTE|UNATC|UAUIM|UNMB|UNEFS|USAMV) /, '').replace(/\\s*\\([A-Z]+\\)$/, ''), raw: u }));\n\n  const byId = (kind) => Object.fromEntries(nodes.filter((n) => n.kind === kind).map((n) => [n.id, n]));\n  const N = { path: byId('path'), career: byId('career'), program: byId('program'), uni: byId('uni') };\n\n  // Edges\n  const edges = [];\n  // path → career (pathType match)\n  CAREERS.forEach((c) => {\n    if (c.pathType && N.path[c.pathType]) {\n      edges.push({ from: N.path[c.pathType], to: N.career[c.id], kind: 'path-career' });\n    }\n  });\n  // program → career (careerIds)\n  PROGRAMS.forEach((p) => {\n    (p.careerIds || []).forEach((cid) => {\n      if (N.career[cid]) edges.push({ from: N.program[p.id], to: N.career[cid], kind: 'prog-career' });\n    });\n  });\n  // program → uni (universityId)\n  PROGRAMS.forEach((p) => {\n    if (N.uni[p.universityId]) edges.push({ from: N.program[p.id], to: N.uni[p.universityId], kind: 'prog-uni' });\n  });\n\n  // Adjacency for highlight-on-hover\n  const adj = new Map();\n  edges.forEach((e) => {\n    const a = e.from.kind + ':' + e.from.id;\n    const b = e.to.kind + ':' + e.to.id;\n    if (!adj.has(a)) adj.set(a, new Set());\n    if (!adj.has(b)) adj.set(b, new Set());\n    adj.get(a).add(b);\n    adj.get(b).add(a);\n  });\n\n  // ── Layout: columns ────────────────────────────────────\n  const COL_X = { path: 80, career: 460, program: 1040, uni: 1700 };\n  const NODE_H = 22;\n  const NODE_GAP = 4;\n  const NODE_W = { path: 280, career: 260, program: 340, uni: 320 };\n\n  function layoutColumns() {\n    const cols = ['path', 'career', 'program', 'uni'];\n    cols.forEach((kind) => {\n      const list = nodes.filter((n) => n.kind === kind);\n      list.forEach((n, i) => {\n        n.x = COL_X[kind];\n        n.y = 60 + i * (NODE_H + NODE_GAP);\n      });\n    });\n  }\n\n  function layoutRadial() {\n    // 4 concentric arcs (path inner, uni outer)\n    const cx = 1000, cy = 1100;\n    const radii = { path: 220, career: 540, program: 880, uni: 1300 };\n    const cols = ['path', 'career', 'program', 'uni'];\n    cols.forEach((kind) => {\n      const list = nodes.filter((n) => n.kind === kind);\n      const total = list.length;\n      const r = radii[kind];\n      // Spread across 270° (top + sides), reserve bottom for legend\n      const startAngle = -Math.PI * 0.95;\n      const span = Math.PI * 1.9;\n      list.forEach((n, i) => {\n        const t = total === 1 ? 0.5 : i / (total - 1);\n        const a = startAngle + t * span;\n        n.x = cx + Math.cos(a) * r;\n        n.y = cy + Math.sin(a) * r;\n        n.angle = a;\n      });\n    });\n  }\n\n  // ── Render ─────────────────────────────────────────────\n  const stage = document.getElementById('stage');\n  const SVG_NS = 'http://www.w3.org/2000/svg';\n  const W = 2200, H = 2400;\n\n  const svg = document.createElementNS(SVG_NS, 'svg');\n  svg.setAttribute('width', W);\n  svg.setAttribute('height', H);\n  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);\n  stage.appendChild(svg);\n\n  const rootG = document.createElementNS(SVG_NS, 'g'); // pan/zoom group\n  rootG.setAttribute('id', 'root');\n  svg.appendChild(rootG);\n\n  const edgeG = document.createElementNS(SVG_NS, 'g'); rootG.appendChild(edgeG);\n  const nodeG = document.createElementNS(SVG_NS, 'g'); rootG.appendChild(nodeG);\n  const labelG = document.createElementNS(SVG_NS, 'g'); rootG.appendChild(labelG);\n\n  function renderColumnHeaders(layout) {\n    labelG.innerHTML = '';\n    if (layout !== 'columns') return;\n    const headers = [\n      { kind: 'path', label: 'TRASEE', count: PATHS.length },\n      { kind: 'career', label: 'CARIERE', count: CAREERS.length },\n      { kind: 'program', label: 'PROGRAME', count: PROGRAMS.length },\n      { kind: 'uni', label: 'UNIVERSITĂȚI', count: UNIS.length },\n    ];\n    headers.forEach((h) => {\n      const t = document.createElementNS(SVG_NS, 'text');\n      t.setAttribute('x', COL_X[h.kind] + NODE_W[h.kind] / 2);\n      t.setAttribute('y', 30);\n      t.setAttribute('text-anchor', 'middle');\n      t.setAttribute('class', 'col-label');\n      t.textContent = h.label;\n      labelG.appendChild(t);\n\n      const c = document.createElementNS(SVG_NS, 'text');\n      c.setAttribute('x', COL_X[h.kind] + NODE_W[h.kind] / 2);\n      c.setAttribute('y', 46);\n      c.setAttribute('text-anchor', 'middle');\n      c.setAttribute('class', 'col-count');\n      c.textContent = h.count + (h.kind === 'uni' ? ' instituții' : ` ${h.kind === 'path' ? 'drumuri' : 'opțiuni'}`);\n      labelG.appendChild(c);\n    });\n  }\n\n  function render(layout) {\n    if (layout === 'columns') layoutColumns();\n    else layoutRadial();\n\n    // Edges first (under nodes)\n    edgeG.innerHTML = '';\n    edges.forEach((e) => {\n      const path = document.createElementNS(SVG_NS, 'path');\n      const fromX = e.from.x + (layout === 'columns' ? NODE_W[e.from.kind] : 0);\n      const fromY = e.from.y + (layout === 'columns' ? NODE_H / 2 : 0);\n      const toX = e.to.x + (layout === 'columns' ? 0 : 0);\n      const toY = e.to.y + (layout === 'columns' ? NODE_H / 2 : 0);\n\n      let d;\n      if (layout === 'columns') {\n        const mx = (fromX + toX) / 2;\n        d = `M${fromX},${fromY} C${mx},${fromY} ${mx},${toY} ${toX},${toY}`;\n      } else {\n        // straight line for radial\n        d = `M${fromX},${fromY} L${toX},${toY}`;\n      }\n      path.setAttribute('d', d);\n      path.setAttribute('class', 'edge');\n      path.dataset.from = e.from.kind + ':' + e.from.id;\n      path.dataset.to = e.to.kind + ':' + e.to.id;\n      edgeG.appendChild(path);\n    });\n\n    // Nodes\n    nodeG.innerHTML = '';\n    nodes.forEach((n) => {\n      const g = document.createElementNS(SVG_NS, 'g');\n      g.setAttribute('class', 'node');\n      g.dataset.key = n.kind + ':' + n.id;\n\n      const r = document.createElementNS(SVG_NS, 'rect');\n      const w = NODE_W[n.kind];\n      const h = NODE_H;\n      r.setAttribute('x', n.x);\n      r.setAttribute('y', n.y);\n      r.setAttribute('width', w);\n      r.setAttribute('height', h);\n      r.setAttribute('fill', FILL[n.kind]);\n      g.appendChild(r);\n\n      const t = document.createElementNS(SVG_NS, 'text');\n      t.setAttribute('x', n.x + 8);\n      t.setAttribute('y', n.y + 15);\n      t.setAttribute('font-size', '11');\n      t.setAttribute('font-weight', n.kind === 'path' ? '800' : '600');\n      t.setAttribute('fill', TEXT[n.kind]);\n      const maxChars = n.kind === 'program' ? 48 : n.kind === 'uni' ? 42 : 36;\n      let lab = n.label;\n      if (lab.length > maxChars) lab = lab.slice(0, maxChars - 1) + '…';\n      t.textContent = lab;\n      g.appendChild(t);\n\n      g.addEventListener('click', (ev) => { ev.stopPropagation(); openPanel(n); });\n      g.addEventListener('mouseenter', () => highlight(n));\n      g.addEventListener('mouseleave', () => clearHighlight());\n\n      nodeG.appendChild(g);\n    });\n\n    renderColumnHeaders(layout);\n  }\n\n  // ── Highlight on hover ─────────────────────────────────\n  function highlight(node) {\n    const key = node.kind + ':' + node.id;\n    const neighbors = adj.get(key) || new Set();\n    nodeG.querySelectorAll('.node').forEach((g) => {\n      const k = g.dataset.key;\n      if (k === key || neighbors.has(k)) g.classList.add('highlight');\n      else g.classList.add('dimmed');\n    });\n    edgeG.querySelectorAll('.edge').forEach((p) => {\n      if (p.dataset.from === key || p.dataset.to === key) p.classList.add('highlight');\n      else p.classList.add('dimmed');\n    });\n  }\n  function clearHighlight() {\n    nodeG.querySelectorAll('.node').forEach((g) => g.classList.remove('highlight', 'dimmed'));\n    edgeG.querySelectorAll('.edge').forEach((p) => p.classList.remove('highlight', 'dimmed'));\n  }\n\n  // ── Detail panel ───────────────────────────────────────\n  const panel = document.getElementById('panel');\n  const panelBody = document.getElementById('panel-body');\n  function openPanel(n) {\n    const r = n.raw;\n    let html = '';\n    if (n.kind === 'path') {\n      html = `\n        <div class=\"kind\" style=\"background: var(--purple); color: #fff;\">Traseu / Drum<\u002Fdiv>\n        <h2>${r.emoji} ${r.name}<\u002Fh2>\n        <div class=\"tagline\">„${r.tagline}\"<\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; font-size: 12px; color: var(--ink-soft); margin-bottom: 12px;\">\n          <div>⏱ ${r.duration}<\u002Fdiv><div>· ${r.cost}<\u002Fdiv>\n        <\u002Fdiv>\n        <h3>Cariere pe acest drum (${(CAREERS.filter((c) => c.pathType === r.id)).length})<\u002Fh3>\n        <ul>${CAREERS.filter((c) => c.pathType === r.id).map((c) => `\n          <li data-jump=\"career:${c.id}\">${c.emoji} <b>${c.name}<\u002Fb><span class=\"small\">${c.tagline}<\u002Fspan><\u002Fli>`).join('')}<\u002Ful>\n      `;\n    } else if (n.kind === 'career') {\n      const linkedProgs = PROGRAMS.filter((p) => (p.careerIds || []).includes(r.id));\n      const path = PATHS.find((p) => p.id === r.pathType);\n      html = `\n        <div class=\"kind\" style=\"background: var(--yellow);\">Carieră<\u002Fdiv>\n        <h2>${r.emoji} ${r.name}<\u002Fh2>\n        <div class=\"tagline\">${r.tagline}<\u002Fdiv>\n        <h3>Drum tipic<\u002Fh3>\n        <div style=\"font-size: 13px;\">${path ? `${path.emoji} ${path.name}` : r.pathType}<\u002Fdiv>\n        <h3>Programe care duc aici (${linkedProgs.length})<\u002Fh3>\n        <ul>${linkedProgs.map((p) => {\n          const u = UNIS.find((x) => x.id === p.universityId);\n          return `<li data-jump=\"program:${p.id}\"><b>${p.name}<\u002Fb><span class=\"small\">${u ? u.name : p.universityId}<\u002Fspan><\u002Fli>`;\n        }).join('') || '<li style=\"color: var(--ink-soft); font-style: italic;\">Nicio facultate listată — drum atipic (autodidact / pro / etc).<\u002Fli>'}<\u002Ful>\n        ${r.skills ? `<h3>Skills cheie<\u002Fh3><div style=\"display: flex; gap: 6px; flex-wrap: wrap;\">${r.skills.map((s) => `<span style=\"background: var(--paper-2); padding: 4px 8px; font-size: 11px; border: 1.5px solid #000;\">${s}<\u002Fspan>`).join('')}<\u002Fdiv>` : ''}\n      `;\n    } else if (n.kind === 'program') {\n      const u = UNIS.find((x) => x.id === r.universityId);\n      const linkedCareers = (r.careerIds || []).map((cid) => CAREERS.find((c) => c.id === cid)).filter(Boolean);\n      html = `\n        <div class=\"kind\" style=\"background: var(--green);\">Program / Specializare<\u002Fdiv>\n        <h2>${r.name}<\u002Fh2>\n        <div class=\"tagline\">${u ? u.name + ' · ' + u.city : r.universityId}<\u002Fdiv>\n        ${r.notes ? `<div style=\"background: var(--paper-2); padding: 10px 12px; font-size: 12px; line-height: 1.5; border: 1.5px solid #000; margin-bottom: 12px;\">${r.notes}<\u002Fdiv>` : ''}\n        <h3>Cariere posibile (${linkedCareers.length})<\u002Fh3>\n        <ul>${linkedCareers.map((c) => `\n          <li data-jump=\"career:${c.id}\">${c.emoji} <b>${c.name}<\u002Fb><span class=\"small\">${c.tagline}<\u002Fspan><\u002Fli>`).join('')}<\u002Ful>\n        ${r.admission ? `<h3>Admitere<\u002Fh3><div style=\"font-size: 12px; line-height: 1.6;\">⏰ ${r.admission.deadline || '—'}<br/>${r.admission.exam || ''}<\u002Fdiv>` : ''}\n        ${r.url ? `<a href=\"${r.url}\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-block; margin-top: 12px; background: #000; color: #fff; padding: 6px 12px; font-size: 11px; font-weight: 700; text-decoration: none; border: 2px solid #000;\">SITE OFICIAL ↗<\u002Fa>` : ''}\n      `;\n    } else if (n.kind === 'uni') {\n      const linkedProgs = PROGRAMS.filter((p) => p.universityId === r.id);\n      html = `\n        <div class=\"kind\" style=\"background: var(--blue);\">Universitate<\u002Fdiv>\n        <h2>${r.name}<\u002Fh2>\n        <div class=\"tagline\">${r.city} · ${r.tier} · ${r.kind}<\u002Fdiv>\n        ${r.notes ? `<div style=\"background: var(--paper-2); padding: 10px 12px; font-size: 12px; line-height: 1.5; border: 1.5px solid #000; margin-bottom: 12px;\">${r.notes}<\u002Fdiv>` : ''}\n        <h3>Programe în date (${linkedProgs.length})<\u002Fh3>\n        <ul>${linkedProgs.map((p) => `<li data-jump=\"program:${p.id}\"><b>${p.name}<\u002Fb>${p.admission ? `<span class=\"small\">⏰ ${p.admission.deadline}<\u002Fspan>` : ''}<\u002Fli>`).join('') || '<li style=\"color: var(--ink-soft); font-style: italic;\">Niciun program detaliat încă.<\u002Fli>'}<\u002Ful>\n        ${r.domains ? `<h3>Domenii<\u002Fh3><div style=\"display: flex; gap: 6px; flex-wrap: wrap;\">${r.domains.map((d) => `<span style=\"background: var(--paper-2); padding: 4px 8px; font-size: 11px; border: 1.5px solid #000;\">${d}<\u002Fspan>`).join('')}<\u002Fdiv>` : ''}\n      `;\n    }\n    panelBody.innerHTML = html;\n    panel.classList.add('open');\n    // Wire jumps\n    panelBody.querySelectorAll('[data-jump]').forEach((el) => {\n      el.addEventListener('click', () => {\n        const [kind, id] = el.dataset.jump.split(':');\n        const n2 = (N[kind] || {})[id];\n        if (n2) {\n          openPanel(n2);\n          panToNode(n2);\n        }\n      });\n    });\n  }\n  window.closePanel = () => panel.classList.remove('open');\n\n  // ── Pan + zoom ─────────────────────────────────────────\n  let scale = 0.55, tx = 80, ty = 0;\n  function applyTransform() {\n    rootG.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);\n  }\n  applyTransform();\n\n  stage.addEventListener('wheel', (e) => {\n    e.preventDefault();\n    const rect = stage.getBoundingClientRect();\n    const mx = e.clientX - rect.left;\n    const my = e.clientY - rect.top;\n    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;\n    const newScale = Math.max(0.2, Math.min(3, scale * factor));\n    // Zoom toward cursor\n    tx = mx - (mx - tx) * (newScale / scale);\n    ty = my - (my - ty) * (newScale / scale);\n    scale = newScale;\n    applyTransform();\n  }, { passive: false });\n\n  let dragging = false, lastX = 0, lastY = 0;\n  stage.addEventListener('mousedown', (e) => {\n    // Don't start a drag if clicking a node\n    if (e.target.closest('.node')) return;\n    dragging = true; lastX = e.clientX; lastY = e.clientY;\n    stage.classList.add('dragging');\n  });\n  window.addEventListener('mousemove', (e) => {\n    if (!dragging) return;\n    tx += e.clientX - lastX;\n    ty += e.clientY - lastY;\n    lastX = e.clientX; lastY = e.clientY;\n    applyTransform();\n  });\n  window.addEventListener('mouseup', () => { dragging = false; stage.classList.remove('dragging'); });\n\n  function panToNode(n) {\n    // Center node in viewport at current scale\n    const stageRect = stage.getBoundingClientRect();\n    const cx = stageRect.width / 2;\n    const cy = stageRect.height / 2;\n    const w = NODE_W[n.kind] || 260;\n    tx = cx - (n.x + w / 2) * scale;\n    ty = cy - (n.y + NODE_H / 2) * scale;\n    applyTransform();\n  }\n\n  document.getElementById('reset').addEventListener('click', () => {\n    scale = 0.55; tx = 80; ty = 0; applyTransform();\n  });\n\n  // ── Layout switcher ────────────────────────────────────\n  document.querySelectorAll('.seg button').forEach((btn) => {\n    btn.addEventListener('click', () => {\n      document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', 'false'));\n      btn.setAttribute('aria-pressed', 'true');\n      currentLayout = btn.dataset.layout;\n      render(currentLayout);\n    });\n  });\n\n  // ── Search filter ──────────────────────────────────────\n  document.getElementById('search').addEventListener('input', (e) => {\n    const q = e.target.value.toLowerCase().trim();\n    if (!q) {\n      nodeG.querySelectorAll('.node').forEach((g) => g.classList.remove('dimmed', 'highlight'));\n      edgeG.querySelectorAll('.edge').forEach((p) => p.classList.remove('dimmed', 'highlight'));\n      return;\n    }\n    const matchKeys = new Set();\n    nodes.forEach((n) => {\n      if (n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)) {\n        matchKeys.add(n.kind + ':' + n.id);\n      }\n    });\n    nodeG.querySelectorAll('.node').forEach((g) => {\n      if (matchKeys.has(g.dataset.key)) g.classList.add('highlight');\n      else g.classList.add('dimmed');\n    });\n    edgeG.querySelectorAll('.edge').forEach((p) => {\n      if (matchKeys.has(p.dataset.from) || matchKeys.has(p.dataset.to)) p.classList.add('highlight');\n      else p.classList.add('dimmed');\n    });\n  });\n\n  // ── Init ───────────────────────────────────────────────\n  let currentLayout = 'columns';\n  render(currentLayout);\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
