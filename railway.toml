[build]
builder = "NIXPACKS"
buildCommand = "mkdir -p apps/web/.next/cache && find apps/web/.next/cache -mindepth 1 -exec rm -rf {} + && npm run build -w @cesafiu/web"

[deploy]
startCommand = "npm run start -w @cesafiu/web -- -p ${PORT:-3000}"
healthcheckPath = "/ro"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
